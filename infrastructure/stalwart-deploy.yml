# Stalwart Mail Server - Render Deployment Config
version: '3.8'
services:
  stalwart:
    image: stalwartlabs/mail-server:latest
    container_name: stalwart-email-bridge
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    environment:
      - CLUSTER_NAME=XMRT-DAO-MAIL
    volumes:
      - stalwart_data:/opt/stalwart-mail
volumes:
  stalwart_data:
