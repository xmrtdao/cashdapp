<!--
  modern-lower-third.html — reusable OpenFilm scene template.
  Built from GoogleChrome/modern-web-guidance patterns (skill: modern-web-guidance):
    - visual-effects: gradient endpoints in oklch, interpolated `in oklab` for
      neutrals (oklch on low-chroma colors hits a Chromium powerless-hue bug
      that tints magenta); `in oklch` only between distinct saturated hues;
      layered shadows (tight contact + wide ambient).
    - precise-text-alignment: text-box: trim-both cap alphabetic so padding
      hugs the glyphs; both edges must be declared.
    - improve-text-layout-and-legibility: text-wrap: balance on short heading
      blocks only — never global.
    - individual-transform-properties: translate/scale instead of transform:;
      identity bases declared so stacking contexts never shift mid-flight.
    - physics-based-easing: the linear() spring curve, evaluated per-frame for
      frame()-driven renderers; never applied to opacity (overshoot flickers).
  Edit NAME and ROLE, set window.film.duration to the clip length.
-->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: system-ui, sans-serif; }
    .lower-third {
      position: absolute; bottom: 60px; left: 50%;
      translate: -50% 0; scale: 1;
      padding: 18px 42px 18px 30px;
      border-radius: 14px;
      background: color-mix(in oklab, oklch(0.16 0.02 260) 74%, transparent);
      backdrop-filter: blur(14px);
      border: 1px solid oklch(1 0 0 / 0.08);
      box-shadow: 0 1px 2px oklch(0 0 0 / 0.40), 0 10px 30px oklch(0 0 0 / 0.35);
      opacity: 0;
    }
    .lower-third::before {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
      border-radius: 14px 0 0 14px;
      background: linear-gradient(in oklch, oklch(0.78 0.16 40), oklch(0.72 0.15 300));
    }
    .name {
      color: oklch(0.97 0.005 260);
      font: 800 44px/1.15 system-ui, sans-serif;
      letter-spacing: -0.02em;
      text-wrap: balance;
      text-box: trim-both cap alphabetic;
      text-shadow: 0 1px 3px oklch(0 0 0 / 0.5);
    }
    .role {
      margin-top: 6px;
      color: oklch(0.75 0.02 260);
      font: 500 24px/1.2 system-ui, sans-serif;
      text-box: trim-both cap alphabetic;
    }
  </style>
</head>
<body>
  <div class="lower-third">
    <div class="name">NAME</div>
    <div class="role">ROLE</div>
  </div>
  <script>
    // linear() spring stops (physics-based-easing), evaluated per-frame.
    const SPRING = [[0,0],[0.005,0.016],[0.01,0.06],[0.02,0.226],[0.054,1.116],[0.066,1.375],[0.077,1.527],[0.082,1.565],[0.088,1.585],[0.093,1.581],[0.098,1.559],[0.109,1.458],[0.143,0.937],[0.155,0.784],[0.166,0.693],[0.171,0.67],[0.177,0.657],[0.187,0.671],[0.198,0.729],[0.233,1.042],[0.245,1.13],[0.256,1.182],[0.267,1.201],[0.277,1.192],[0.288,1.156],[0.322,0.977],[0.334,0.925],[0.345,0.894],[0.356,0.882],[0.366,0.887],[0.377,0.907],[0.424,1.045],[0.445,1.069],[0.463,1.059],[0.509,0.979],[0.534,0.96],[0.553,0.966],[0.599,1.013],[0.623,1.024],[0.712,0.986],[0.799,1.008],[0.889,0.995],[1,1]];
    function spring(p) {
      if (p <= 0) return 0;
      if (p >= 1) return 1;
      for (let i = 1; i < SPRING.length; i++) {
        if (p <= SPRING[i][0]) {
          const [p0, v0] = SPRING[i - 1], [p1, v1] = SPRING[i];
          return v0 + (v1 - v0) * ((p - p0) / (p1 - p0));
        }
      }
      return 1;
    }
    const easeOutCubic = (p) => 1 - Math.pow(1 - p, 3);
    const easeInCubic = (p) => p * p * p;
    const clamp01 = (x) => Math.min(1, Math.max(0, x));

    window.film = {
      duration: 4, width: 1920, height: 1080,
      frame(t) {
        const el = document.querySelector('.lower-third');
        const IN = 0.2, RISE = 0.7, OUT = 3.4, FALL = 0.6;
        let o = 0;
        if (t >= IN && t < IN + RISE) o = easeOutCubic((t - IN) / RISE);
        else if (t >= IN + RISE && t < OUT) o = 1;
        else if (t >= OUT && t < OUT + FALL) o = 1 - easeInCubic((t - OUT) / FALL);
        el.style.opacity = String(o);
        const p = clamp01((t - IN) / RISE);
        el.style.translate = `-50% ${24 * (1 - spring(p))}px`;
        el.style.scale = String(0.94 + 0.06 * spring(p));
      },
    };
    if (!window.filmHost) { const t0 = performance.now(); const loop = () => { window.film.frame(((performance.now() - t0) / 1000) % window.film.duration); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  </script>
</body>
</html>
