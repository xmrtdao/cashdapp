<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0c0d12; font-family: system-ui, sans-serif; }
    .backdrop {
      position: absolute; inset: 0;
      background:
        radial-gradient(120% 80% at 50% 110%, oklch(0.30 0.07 300) 0%, transparent 55%),
        linear-gradient(in oklab, oklch(0.15 0.02 260) 0%, oklch(0.08 0.01 260) 100%);
      translate: 0px; scale: 1;
    }
    .recap { position: absolute; top: 200px; left: 0; right: 0; display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; padding: 0 200px; }
    .chip {
      padding: 16px 34px; border-radius: 999px;
      font-size: 30px; white-space: nowrap;
      text-box: trim-both cap alphabetic;
      color: oklch(0.97 0.005 260);
      background: color-mix(in oklab, oklch(0.18 0.03 262) 74%, transparent);
      backdrop-filter: blur(14px);
      border: 1px solid oklch(1 0 0 / 0.09);
      box-shadow: 0 1px 2px oklch(0 0 0 / 0.40), 0 10px 30px oklch(0 0 0 / 0.35);
      opacity: 0; translate: 0 0; scale: 1;
    }
    .endtitle {
      position: absolute; left: 0; right: 0; top: 470px;
      text-align: center;
      font: 800 200px/1 system-ui, sans-serif;
      letter-spacing: -0.03em;
      text-wrap: balance;
      text-box: trim-both cap alphabetic;
      background: linear-gradient(in oklch, oklch(0.85 0.14 220), oklch(0.82 0.15 300), oklch(0.80 0.15 40));
      background-clip: text; -webkit-background-clip: text;
      color: transparent;
      opacity: 0; translate: 0px; scale: 1;
      filter: drop-shadow(0 4px 12px oklch(0 0 0 / 0.55)) drop-shadow(0 24px 60px oklch(0 0 0 / 0.35));
    }
    .foot {
      position: absolute; left: 0; right: 0; top: 720px;
      text-align: center;
      color: oklch(0.78 0.02 260);
      font: 500 36px/1.2 system-ui, sans-serif;
      text-box: trim-both cap alphabetic;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="recap">
    <div class="chip">HTML &amp; CSS frames</div>
    <div class="chip">Library transitions</div>
    <div class="chip">Physics easing</div>
    <div class="chip">CSS grades</div>
  </div>
  <div class="endtitle">OpenFilm</div>
  <div class="foot">Every frame is a function of time</div>
  <script>
    const SPRING = [[0,0],[0.005,0.016],[0.01,0.06],[0.02,0.226],[0.054,1.116],[0.066,1.375],[0.077,1.527],[0.082,1.565],[0.088,1.585],[0.093,1.581],[0.098,1.559],[0.109,1.458],[0.143,0.937],[0.155,0.784],[0.166,0.693],[0.171,0.67],[0.177,0.657],[0.187,0.671],[0.198,0.729],[0.233,1.042],[0.245,1.13],[0.256,1.182],[0.267,1.201],[0.277,1.192],[0.288,1.156],[0.322,0.977],[0.334,0.925],[0.345,0.894],[0.356,0.882],[0.366,0.887],[0.377,0.907],[0.424,1.045],[0.445,1.069],[0.463,1.059],[0.509,0.979],[0.534,0.96],[0.553,0.966],[0.599,1.013],[0.623,1.024],[0.712,0.986],[0.799,1.008],[0.889,0.995],[1,1]];
    function spring(p) {
      if (p <= 0) return 0;
      if (p >= 1) return 1;
      for (let i = 1; i < SPRING.length; i++) {
        if (p <= SPRING[i][0]) {
          const [p0, v0] = SPRING[i - 1], [p1, v1] = SPRING[i];
          return v0 + (v1 - v0) * ((p - p0) / (p1 - p0));
        }
      }
      return 1;
    }
    const easeOutCubic = (p) => 1 - Math.pow(1 - p, 3);
    const clamp01 = (x) => Math.min(1, Math.max(0, x));

    window.film = {
      duration: 9.9, width: 1920, height: 1080,
      frame(t) {
        document.querySelector('.backdrop').style.scale = String(1.08 - 0.08 * easeOutCubic(clamp01(t / 9.9)));
        document.querySelectorAll('.chip').forEach((el, i) => {
          const at = 0.3 + i * 0.35;
          const p = clamp01((t - at) / 0.7);
          el.style.opacity = String(easeOutCubic(p));
          el.style.translate = `0 ${22 * (1 - spring(p))}px`;
          el.style.scale = String(0.92 + 0.08 * spring(p));
        });
        const title = document.querySelector('.endtitle');
        const tp = clamp01((t - 2.6) / 1.2);
        title.style.opacity = String(easeOutCubic(tp));
        title.style.translate = `0 ${50 * (1 - spring(tp))}px`;
        title.style.scale = String(0.94 + 0.06 * spring(tp));
        document.querySelector('.foot').style.opacity = String(easeOutCubic(clamp01((t - 3.6) / 0.8)));
      },
    };
    if (!window.filmHost) { const t0 = performance.now(); const loop = () => { window.film.frame(((performance.now() - t0) / 1000) % 9.9); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  </script>
</body>
</html>
