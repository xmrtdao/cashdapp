<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    .backdrop {
      position: absolute; inset: 0;
      background:
        radial-gradient(130% 90% at 50% -10%, oklch(0.38 0.06 255) 0%, transparent 60%),
        linear-gradient(in oklab, oklch(0.21 0.02 260) 0%, oklch(0.10 0.01 260) 100%);
      translate: 0px; scale: 1;
    }
    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(115% 80% at 50% 44%, transparent 52%, oklch(0 0 0 / 0.5) 100%);
    }
    .title {
      position: absolute; left: 0; right: 0; top: 400px;
      text-align: center;
      font: 800 190px/1 system-ui, sans-serif;
      letter-spacing: -0.03em;
      text-wrap: balance;
      text-box: trim-both cap alphabetic;
      /* Gradient text: saturated hue endpoints, interpolated in oklch so chroma
         survives (visual-effects: `in oklch` for distinct saturated hues). */
      background: linear-gradient(in oklch, oklch(0.85 0.14 220), oklch(0.82 0.15 300), oklch(0.80 0.15 40));
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      opacity: 0;
      translate: 0px; scale: 1;
      filter: drop-shadow(0 4px 12px oklch(0 0 0 / 0.55)) drop-shadow(0 24px 60px oklch(0 0 0 / 0.35));
    }
    .sub {
      position: absolute; left: 0; right: 0; top: 640px;
      text-align: center;
      color: oklch(0.90 0.02 260);
      font: 500 44px/1 system-ui, sans-serif;
      letter-spacing: 0.55em; padding-left: 0.55em;
      text-box: trim-both cap alphabetic;
      opacity: 0;
      translate: 0px;
    }
    .chip {
      position: absolute; left: 50%; top: 790px;
      translate: -50% 0; scale: 1;
      padding: 14px 30px;
      border-radius: 999px;
      font-size: 26px;
      text-box: trim-both cap alphabetic;
      color: oklch(0.97 0.005 260);
      background: color-mix(in oklab, oklch(0.16 0.02 260) 74%, transparent);
      backdrop-filter: blur(14px);
      border: 1px solid oklch(1 0 0 / 0.08);
      box-shadow: 0 1px 2px oklch(0 0 0 / 0.40), 0 10px 30px oklch(0 0 0 / 0.35);
      opacity: 0;
      white-space: nowrap;
    }
    .chip.b { top: 880px; }
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="vignette"></div>
  <div class="title">OPENFILM</div>
  <div class="sub">STUDIO</div>
  <div class="chip a">Every frame is HTML &amp; CSS</div>
  <div class="chip b">A film is a function of time</div>
  <script>
    const SPRING = [[0,0],[0.005,0.016],[0.01,0.06],[0.02,0.226],[0.054,1.116],[0.066,1.375],[0.077,1.527],[0.082,1.565],[0.088,1.585],[0.093,1.581],[0.098,1.559],[0.109,1.458],[0.143,0.937],[0.155,0.784],[0.166,0.693],[0.171,0.67],[0.177,0.657],[0.187,0.671],[0.198,0.729],[0.233,1.042],[0.245,1.13],[0.256,1.182],[0.267,1.201],[0.277,1.192],[0.288,1.156],[0.322,0.977],[0.334,0.925],[0.345,0.894],[0.356,0.882],[0.366,0.887],[0.377,0.907],[0.424,1.045],[0.445,1.069],[0.463,1.059],[0.509,0.979],[0.534,0.96],[0.553,0.966],[0.599,1.013],[0.623,1.024],[0.712,0.986],[0.799,1.008],[0.889,0.995],[1,1]];
    function spring(p) {
      if (p <= 0) return 0;
      if (p >= 1) return 1;
      for (let i = 1; i < SPRING.length; i++) {
        if (p <= SPRING[i][0]) {
          const [p0, v0] = SPRING[i - 1], [p1, v1] = SPRING[i];
          return v0 + (v1 - v0) * ((p - p0) / (p1 - p0));
        }
      }
      return 1;
    }
    const easeOutCubic = (p) => 1 - Math.pow(1 - p, 3);
    const clamp01 = (x) => Math.min(1, Math.max(0, x));

    window.film = {
      duration: 11.2, width: 1920, height: 1080,
      frame(t) {
        document.querySelector('.backdrop').style.scale = String(1.10 - 0.10 * easeOutCubic(clamp01(t / 11.2)));
        const title = document.querySelector('.title');
        const tp = clamp01(t / 1.1);
        title.style.opacity = String(easeOutCubic(tp));
        title.style.translate = `0 ${44 * (1 - spring(clamp01(t / 1.2)))}px`;
        title.style.scale = String(0.94 + 0.06 * spring(clamp01(t / 1.2)));
        const sub = document.querySelector('.sub');
        const sp = clamp01((t - 0.7) / 0.9);
        sub.style.opacity = String(easeOutCubic(sp));
        sub.style.translate = `0 ${24 * (1 - spring(sp))}px`;
        const rise = (sel, at, len) => {
          const el = document.querySelector(sel);
          const p = clamp01((t - at) / len);
          el.style.opacity = String(easeOutCubic(p));
          el.style.translate = `-50% ${18 * (1 - spring(p))}px`;
          el.style.scale = String(0.94 + 0.06 * spring(p));
        };
        rise('.chip.a', 1.6, 0.7);
        rise('.chip.b', 2.4, 0.7);
      },
    };
    if (!window.filmHost) { const t0 = performance.now(); const loop = () => { window.film.frame(((performance.now() - t0) / 1000) % 11.2); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  </script>
</body>
</html>
