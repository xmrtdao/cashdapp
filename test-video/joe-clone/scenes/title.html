<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    .title {
      position: absolute;
      left: 0;
      right: 0;
      top: 460px;
      text-align: center;
      color: #fff;
      font: 800 160px/1 system-ui, sans-serif;
      letter-spacing: -0.03em;
      opacity: 0;
    }
    .lower-third {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 24px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      opacity: 0;
    }
    .intro {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      color: black;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 20px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="title">JOE LEE</div>
  <div class="lower-third">Voice Demonstration</div>
  <div class="intro">Generated with MOSS-TTS-Nano</div>
  <script>
    window.film = {
      duration: 5, width: 1920, height: 1080,
      frame(t) {
        const title = document.querySelector('.title');
        const lower = document.querySelector('.lower-third');
        const intro = document.querySelector('.intro');
        // Fade in title
        if (t < 0.8) title.style.opacity = String(t / 0.8);
        else title.style.opacity = '1';
        // Lower third appears at 1s, disappears at 4.2s
        if (t > 1.0 && t < 4.2) {
          lower.style.opacity = String(Math.min(1, (t - 1.0) / 0.5));
        } else if (t >= 4.2 && t < 4.8) {
          lower.style.opacity = String(Math.max(0, 1 - (t - 4.2) / 0.6));
        } else {
          lower.style.opacity = '0';
        }
        // Intro appears at 0.5s
        if (t > 0.5 && t < 1.5) {
          intro.style.opacity = String(Math.min(1, (t - 0.5) / 0.5));
        } else if (t >= 1.5 && t < 2.0) {
          intro.style.opacity = String(Math.max(0, 1 - (t - 1.5) / 0.5));
        } else {
          intro.style.opacity = '0';
        }
      },
    };
    if (!window.filmHost) { const t0 = performance.now(); const loop = () => { window.film.frame(((performance.now() - t0) / 1000) % 5); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  </script>
</body>
</html>
